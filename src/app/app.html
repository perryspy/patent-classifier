<div class="app-shell">

  <header class="app-header">
    <div class="header-brand">
      <span class="header-logo">⊕</span>
      <div class="header-titles">
        <span class="header-title">PatentClass</span>
        <span class="header-subtitle">CPC / IPC Classification Browser</span>
      </div>
    </div>
    <div class="header-actions">
      <button
        class="theme-toggle"
        (click)="toggleTheme()"
        [attr.aria-label]="theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
      >
        {{ theme() === 'dark' ? '☀' : '☽' }}
      </button>
    </div>
  </header>

  <main class="app-main">
    <aside class="app-sidebar">
      <app-search />
    </aside>
    <section class="app-content">
      <app-browser />
    </section>
  </main>

  <footer class="app-status">
    <span class="status-item">CPC Edition 2024.01</span>
    <span class="status-sep">·</span>
    <span class="status-item">250,000+ classifications indexed</span>
    <span class="status-sep">·</span>
    <span class="status-item status-item--built">Angular 19 · Signals · Standalone Components</span>
  </footer>

</div>
